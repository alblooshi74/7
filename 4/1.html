{t:"الدرس 1: مدخل إلى الثقافة الإسلامية",e:"<b>أولاً: تعريف الثقافة الإسلامية</b><br>• المعنى اللغوي (يدور حول الفهم والإدراك والضبط): الحذق والفهم والفطنة (رجل ثِقْف: حاذق فهم)؛ سرعة التعلم (ثَقِفَ الشيء: أسرع تعلمه وإدراكه)؛ ضبط الأمور والقيام بها (رجل ثِقْف: ضابط لما يحويه قائم به)؛ إدراك الشيء والظفر به (ثَقِفَه: أدركه وظفر به).<br>• اصطلاحاً: مجموعة من العقائد والمعارف والفنون والتقاليد والمثل والمهارات، تنبع من الخطاب الشرعي وتستوعب قضاياه، وتتواءم مع القيم الإنسانية المشتركة، وتضمن الحصانة الفكرية والاستقامة السلوكية في المجتمعات المسلمة. مصدرها القرآن والسنة، وغايتها الحصانة الفكرية والاستقامة السلوكية.<br><b>ثانياً: ملامح الخطاب الشرعي (6)</b><br>1. العقلانية: استخدام العقل في التفكير والحكم وإعلاء قيمته وذم التقليد الأعمى (لفظ العقل ورد 49 موضعاً، والمهارات العقلية كالنظر والتفكر والتدبر والتأمل والاجتهاد والاستنباط في أكثر من 696 موضعاً).<br>2. الإنسانية: الإنسان غاية الوجود ولأجله سُخّر الكون، وتقديس كرامته وحياته والمساواة بين البشر (ذُكر الإنسان 97 موضعاً وفي القرآن سورة الإنسان، والخطاب موجه للناس كافة).<br>3. الواقعية: مراعاة واقع الناس وقدراتهم والتخفيف عن أصحاب الأعذار (إباحة الفطر للمسافر والمريض، وقصر الصلاة للمسافر)، ودليلها نزول القرآن منجماً على مدار 23 سنة.<br>4. التوازن: بين النفس والجسد (العبادات تغذي الروح والتشريعات تراعي الجسد)، الدنيا والآخرة، الإيمان والعقل، الأخذ بالأسباب والتوكل على الله.<br>5. محورية القيم والأخلاق: مكارم الأخلاق غاية الرسالة «بُعثت لأتمم مكارم الأخلاق»، وكل عبادة تحمل بعداً أخلاقياً: الصلاة تنهى عن الفحشاء والمنكر، الزكاة تطهّر النفس وتزكيها، الصيام يحقق التقوى، الحج لا رفث ولا فسوق ولا جدال. ومن مكارم الأخلاق: الرحمة، الحكمة، التسامح، السلام، المحبة، التعاون.<br>6. الانفتاح وقبول الآخر: الدعوة إلى التعارف بين الشعوب والقبائل، أخبار الحضارات (مصر، عاد، ثمود، سبأ)، الإفادة من تجارب الحضارات النافعة، رسائل النبي ﷺ إلى الملوك والأمراء (26 وثيقة)، بيت الحكمة في العصر العباسي وترجمة كتب المعارف اليونانية (الفلسفة، الهندسة، الموسيقى، الطب)، والحث على تعلم لغات الآخرين (زيد بن ثابت تعلم كتاب يهود بأمر النبي ﷺ).",q:[

{t:"الدرس 2: القرآن الكريم",e:"<b>أولاً: تعريفه</b><br>• لغةً: مشتق من (قرأ) بمعنى الجمع والضم، لأنه يجمع السور والآيات والحروف ويضم بعضها إلى بعض (قرأت الماء في الحوض: جمعته فيه).<br>• اصطلاحاً: كلام الله تعالى المعجز، المنزل على سيدنا محمد ﷺ بواسطة جبريل عليه السلام، المكتوب في المصاحف، المنقول بالتواتر، المتعبد بتلاوته، المبدوء بالفاتحة والمختتم بالناس.<br>• قيود التعريف الستة: كلام الله (يُخرج كلام غيره من الملائكة والإنس والجن)؛ المنزل على محمد ﷺ (يُخرج التوراة والإنجيل)؛ المعجز ولو بسورة منه؛ المكتوب في المصاحف (دُوّن منذ عهد النبي ﷺ بإشرافه)؛ المتعبد بتلاوته (عبادة يُثاب عليها والصلاة لا تصح إلا به)؛ المنقول بالتواتر (نقله جمع عظيم يفيد العلم اليقيني).<br>• أشهر أسمائه: الكتاب، الفرقان، الذكر.<br>• السور المكية: نزلت 13 سنة، قصر الآيات، بيان وحدة الرسالات السماوية، الإجمال في التشريع، ترسيخ الإيمان، الحث على مكارم الأخلاق.<br>• السور المدنية: نزلت 10 سنوات، طول الآيات، التفصيل في الأحكام الشرعية، الدعوة إلى التعايش والاستقرار والسلم.<br>• القاسم المشترك: ترسيخ الإيمان بالله، ربط العباد بخالقهم، التأكيد على الأخلاق الفاضلة والقيم المثلى.<br><b>ثانياً: مقاصده الكبرى</b><br>ترسيخ الإيمان وعبادة الرحمن، تكريم الإنسان، تعليم الإنسان، تزكية الوجدان، بناء الأوطان.<br>أثره في تنظيم علاقة الإنسان: بربه (معرفة الله، حسن الظن به، مراقبته، التوكل عليه، عبادته)؛ بغيره (الصدق، التواضع، التعارف والإحسان)؛ بنفسه (تزكيتها، إعمال العقل، تنمية الفكر، التزود بالحكمة)؛ بالكون (المحافظة على الأرض واستدامتها وإعمارها وترشيد استعمال مواردها).<br><b>ثالثاً: منهج فهمه</b><br>فهم القرآن هو المدخل الصحيح لحسن العمل به: تدبر آياته والتفكر في مراميه، بمنهج علمي دقيق شامل ينطلق من:<br>1) النظرة الكلية: النظر إلى القرآن باعتباره وحدة كاملة متكاملة مترابطة.<br>2) الدلالة اللغوية: فهم معاني الألفاظ ومعرفة غريبها والتمييز بين الحقيقة والمجاز.<br>3) البيان النبوي: الاعتماد على ما ورد عن النبي ﷺ في بيان معاني القرآن وتفسيره.<br>4) النظرة المقاصدية: استحضار الغايات والحكم والمقاصد الشرعية التي جاء بها الإسلام، ولا يأتي التدبر إلا لمن التفت إلى مقاصد القرآن وتحقيقها.<br>5) أسباب النزول والسياق: مراعاة القضايا والحوادث التي صاحبت نزول الآيات ومعرفة سبب نزولها وقصتها، لأنها طريق قوي لفهم معاني القرآن.",q:[

{t:"الدرس 3: الهدي النبوي والسيرة العطرة",e:"<b>أولاً: المفهوم والأهمية</b><br>• الهدي النبوي: ما يُضاف إلى النبي ﷺ من أقواله وأفعاله وأحواله بهدف الاقتداء به (الهدي لغةً: الهيئة والطريقة والسيرة الحسنة).<br>• السيرة العطرة: علم يدرس كل ما يتعلق بالنبي ﷺ من أيامه وأخباره وصفاته وأخلاقه، ويطلع على دلائل نبوته من ولادته إلى وفاته (السيرة لغةً: الطريقة، يقال سار بهم سيرة حسنة). السيرة والهدي النبوي مترادفان في المعنى؛ والفرق للفهم: الهدي أقواله وأفعاله وأحواله للاقتداء، والسيرة دراسة حياته وأخباره وصفاته وأخلاقه من الولادة إلى الوفاة.<br>• أهميتها: التعرف إلى شخصيته ﷺ (حسن صفاته ومظهره وصفاء قلبه وهدوئه وصدقه وأمانته)؛ معرفة هديه في حياته وعبادته وعلاقاته وتربيته وتعليمه؛ إدراك حقيقة الفهم النبوي لبيان التنزيل القرآني والخطاب الشرعي؛ الاطلاع على القيم الكبرى (التزكية والعلم والحكمة)؛ تثبيت الإيمان وتصديقه بالتعرف إلى دلائل نبوته وشمائله وأخلاقه؛ تعميق المحبة والإجلال والتعظيم.<br><b>ثانياً: مصادرها</b><br>1) القرآن الكريم: أصدق وأوثق وأهم مصدر للسيرة، لأنه يذكر كثيراً من أحداثها مقرونة بالدروس والعبر، مثل: ما قبل البعثة (سورة الضحى)، الأحداث المصاحبة للبعثة وبداية نزول الوحي (سورتا العلق والمزمل).<br>2) الحديث النبوي الشريف: من أهم المصادر، فقد دوّن أصحاب كتب الحديث مشاهده ﷺ وصفاته ودلائل نبوته ومناقبه، ويشمل: سفره وإقامته، أحواله من نوم ويقظة وإشارة وتصريح وصمت ونطق، نهوضه وقعوده، مأكله ومشربه وملبسه ومركبه.<br><b>ثالثاً: منهج فهمها</b><br>الاستناد إلى ضوابط علمية وقواعد منهجية لتحقيق الفهم الصحيح: 1) الاستناد إلى مدلولات اللغة العربية والرجوع إلى معاجمها لفهم الألفاظ التي يصعب إدراك معانيها. 2) الاستنارة بالمقاصد الكلية للشريعة ومراعاة المقاصد العامة والأهداف الكبرى، بعيداً عن القراءة الحرفية الصرفة.<br><b>رابعاً: أثرها في تعزيز الخلق</b><br>1) المسؤولية الفردية والمجتمعية: تنمية حس المسؤولية تجاه النفس والآخرين، وأداء الواجبات وتحمل تبعات الأفعال.<br>2) العمل والإنتاجية: الحث على العمل والجد والاجتهاد واغتنام الفرص.<br>3) الإيجابية والتفاؤل: بث روح التفاؤل والأمل ونبذ التشاؤم والنظرة السلبية (يصيب بالإحباط ويقعد عن العمل). الكلمة الطيبة تبعث على التفاؤل وتستثير الهمم.<br>4) التوازن والاعتدال: اتخاذ الاعتدال منهجاً، والتوازن سمة للشخصية في جميع الشؤون الدينية والدنيوية.<br>5) الآداب في التعامل: التحلي بمحاسن الآداب ومكارم الأخلاق في القول والفعل. مع الأسرة: إحسان معاملة الزوجة، الرحمة بالأطفال، العناية بالبنات والإحسان إليهن. مع المجتمع: حسن الجوار (عدم إيذاء الجار)، إكرام الضيف، عيادة المريض ومواساته. مع الآخر: الوصية بأهل الذمة، عيادة أهل الكتاب وزيارتهم، اللطف والإحسان والبر والعدل مع الجميع.",q:[

{t:"الدرس 4: الفقه الإسلامي",e:"<b>أولاً: تعريفه</b><br>• لغةً: الإدراك (الوصول إلى حقيقة الشيء والإحاطة به علماً)، الفطنة (سرعة الفهم والذكاء)، العلم (معرفة الشيء ثم اختص بعلم الشريعة)، الفهم (إدراك المعاني فهماً صحيحاً دقيقاً). ابن فارس: الفقه إدراك الشيء والعلم به؛ ابن منظور: يدل على الفطنة؛ الأزهري: الفقه هو الفهم. دعا النبي ﷺ لابن عباس: «اللهم فقهه في الدين».<br>• الفقيه المتمكن: عالماً بأصول الشريعة وفروعها ومصادرها، فطناً بآليات الاستنباط من النصوص والقواعد، مدركاً للواقع ومتغيراته وأحوال الناس وحاجاتهم، فاهماً للنصوص ودلالاتها وحِكمها وعللها ومقاصدها.<br>• اصطلاحاً: «العلم بالأحكام الشرعية العملية المكتسب من الأدلة التفصيلية». العلم: المعرفة والإدراك الراسخ لا مجرد الظن. الأحكام الشرعية: ما شرعه الله لتنظيم حياة المكلفين في العبادات والمعاملات. العملية: المتعلقة بأفعال المكلفين وتصرفاتهم لا الاعتقادية. المكتسب: المستنبط بالاجتهاد والنظر والاستدلال لا العلم الضروري البديهي. الأدلة التفصيلية: ما يُستند إليه لمعرفة الأحكام كالقرآن والسنة والإجماع والقياس والقواعد الكلية.<br>• أهميته: من أهم منابع الخطاب الشرعي. الجوانب: العبادات (الصلاة، الصيام، الحج، الزكاة)، المعاملات (البيع، الشراء، الإجارة)، الأحوال الشخصية (الزواج، الطلاق، الميراث، النفقة). وينظم علاقة الإنسان بربه (العبادات)، بالآخرين (المعاملات)، بالكون (حماية البيئة واستدامتها والرفق بها).<br><b>ثانياً: نشأته وتطوره</b><br>1) عهد النبي ﷺ: القرآن لبيان الأحكام العامة والقواعد الكلية، ينزل بحسب الحاجة والمصلحة؛ والسنة لبيان الأحكام التفصيلية: توضح المجمل، تفصّل المبهم، تخصص العام.<br>2) عهد الصحابة: الرجوع إلى القرآن والسنة والقياس، والاجتهاد في المسائل المستجدة مع مراعاة مقاصد الشريعة. منهج أبي بكر الصديق في القضاء: يقضي بكتاب الله أولاً، فإن لم يجد رجع إلى سنة رسول الله ﷺ، فإن لم يجد سأل المسلمين هل يعلمون قضاءً للنبي ﷺ، فإن لم يجد استشار رؤوس المسلمين وعلماءهم، فإذا اجتمع رأيهم على أمر قضى به. فقهاء الأمصار: مكة المكرمة (عبد الله بن عباس، حبر الأمة وترجمان القرآن)؛ المدينة المنورة (زيد بن ثابت وعبد الله بن عمر، فقهاء دار الهجرة)؛ الكوفة في العراق (علي بن أبي طالب وعبد الله بن مسعود، من أقضى الصحابة وأعلمهم).<br>3) عهد التابعين: اتباع منهج الصحابة في استنباط الأحكام، واختيار ما يؤديه الاجتهاد من فتاواهم، والأخذ غالباً بفتوى الصحابي الذي نشر الفقه في البلد؛ وظهرت الاختلافات المنهجية والمدارس الفقهية.<br>• مدرسة الحديث (الحجاز، المدينة): العالم البارز سعيد بن المسيب، الإكثار من الرواية عن الصحابة، الأخذ بالمصلحة وعمل أهل المدينة، لا تفترض الوقائع قبل حدوثها.<br>• مدرسة الرأي (العراق، الكوفة): العالم البارز إبراهيم النخعي، التوسع في القياس والرأي والتعليل، تفترض الوقائع للتدريب. أثرهما: ساهمتا في نشوء المذاهب الفقهية على أيدي الأئمة المجتهدين.<br><b>ثالثاً: المذاهب الفقهية الأربعة</b><br>1) الحنفي: الإمام أبو حنيفة النعمان بن ثابت (80-150هـ، العراق)، فقيه أهل العراق، عُدّ من صغار التابعين لأنه رأى بعض الصحابة. مصادره: كتاب الله، سنة رسوله ﷺ والآثار الصحيحة، أقوال الصحابة (ولا يخرج عنها)، القياس والاستحسان عند عدم النص. أشهر تلاميذه: محمد بن الحسن الشيباني (دوّن فقه أبي حنيفة، ت 189هـ)، أبو يوسف يعقوب بن إبراهيم (ت 182هـ).<br>2) المالكي: الإمام مالك بن أنس (93-179هـ، المدينة)، إمام دار الهجرة، أخذ عن نافع مولى ابن عمر وابن شهاب الزهري وربيعة الرأي. قال الشافعي: «إذا ذُكر العلماء فمالك النجم». مصادره: القرآن والسنة، الإجماع والقياس، عمل أهل المدينة (حجة عنده)، قول الصحابي، الاستحسان، المصالح المرسلة، سد الذرائع. من تلاميذه: عبد الرحمن بن القاسم المصري (ت 191هـ)، عبد الله بن وهب بن مسلم (ت 197هـ)، أشهب.<br>3) الشافعي: الإمام محمد بن إدريس الشافعي (150-204هـ، الشام ومصر)، جمع بين مدرستي الحديث والرأي، تتلمذ على الإمام مالك ومحمد بن الحسن الشيباني، وضع قواعد علم أصول الفقه في كتابه «الرسالة»، ودوّن فقهه بنفسه في كتاب «الأم»، ويُعد أول من رتّب الاحتجاج بالسنة. مصادره: القرآن، السنة، الإجماع، القياس (ووضع له ضوابط دقيقة)، الاستصحاب. أشهر تلاميذه: يوسف بن يحيى البويطي (ت 231هـ)، إسماعيل بن يحيى المزني (ت 264هـ)، المرادي.<br>4) الحنبلي: الإمام أحمد بن محمد بن حنبل (164-241هـ، بغداد)، إمام أهل الحديث الذي اهتم بحفظ الحديث وتصنيفه، ومن أشهر كتبه «المسند»، أخذ عن الإمام الشافعي. قال الشافعي: «خرجت من بغداد وما خلفت فيها أفقه ولا أعلم من ابن حنبل». من تلاميذه: صالح بن أحمد (ت 266هـ، نقل فقه أبيه)، عبد الله بن أحمد (ت 290هـ، روى الحديث عن أبيه)، الأثرم.<br><b>رابعاً: ملامح الفقه الإسلامي</b><br>1) الجمع بين النظر إلى النصوص الشرعية ومراعاة روحها ومقاصدها: الاستدلال بظواهر نصوص الكتاب والسنة، والقياس على النصوص الثابتة في الوقائع المستجدة، والاهتداء بالمقاصد العامة والقواعد الكلية والمبادئ الكبرى. (ذكر الإمام الجويني أن الاقتصار على النصوص لا يتيح اتساع باب الاجتهاد.)<br>2) مراعاة المصلحة الإنسانية: تحقيق مصالح الناس ودفع المفاسد عنهم بما يحقق سعادتهم في الدنيا والآخرة. تحريم ما تمحضت مفسدته كالخمر والميسر والربا، وإباحة ما فيه النفع والخير إذا لم يرد فيه نهي.<br>3) مركزية التيسير ورفع الحرج: قيام أحكام الفقه على التيسير والسماحة والسعة ورفع المشقة غير المعتادة عن المكلف. صور التخفيف: الإسقاط (إسقاط فرض الحج عن غير المستطيع)؛ التنقيص (قصر الصلاة الرباعية إلى ركعتين للمسافر)؛ التقديم والتأخير (الجمع بين المغرب والعشاء أو الظهر والعصر في السفر والمرض)؛ الإبدال (التيمم بدل الوضوء عند فقد الماء أو العجز)؛ تغيير الهيئة (الصلاة جالساً لمن عجز عن القيام أو مضطجعاً لمن عجز عن الجلوس، حديث عمران بن حصين).<br>4) استيعاب المستجدات والنوازل: مواكبة حاجات العصر ومتغيراته بمرونة، مع الاعتماد على النصوص والمقاصد والقواعد الشرعية وفهم الواقع والموازنة بين المصالح والمفاسد والاستعانة بأهل الاختصاص. المجالات: الطبية، الاقتصادية والمالية، البيئية، الفضائية، التقنية والرقمية. الأدوات: النصوص الشرعية والكليات الكبرى والقواعد العامة ومقاصد الشريعة؛ فهم الواقع فهماً صحيحاً واعتبار المآلات؛ إعمال فقه الموازنات بين المصالح والمفاسد؛ الانفتاح على المعارف الكونية والاستعانة بأهل الاختصاص في العلوم الحديثة.",q:[

{t:"الدرس 5: الإفتاء",e:"<b>أولاً: المفهوم</b><br>• لغةً: مصدر أفتى بمعنى بيّن الحكم وأجاب عن المسألة. المفتي: المجيب عن الحكم الشرعي. المستفتي: السائل عن الحكم. الفتوى والفتيا: اسما مصدر.<br>• اصطلاحاً: بيان الرأي الشرعي في واقعة مخصوصة بمقتضى الأدلة الشرعية على جهة الإجمال.<br><b>أهميته:</b> أحد أهم وسائل بيان الحكم الشرعي؛ به يُعرف الحلال والحرام؛ تتضح به أحكام النوازل والمستجدات؛ يتبصّر الناس بأمور دينهم؛ نسبه الله تعالى إلى نفسه تعظيماً لشأنه.<br><b>خطورته:</b> الخطأ فيها قد يؤدي إلى فساد الأديان وخراب الأوطان. كان الصحابة يتهيبون الفتوى خوفاً من الخطأ، وكان أحدهم يرد السؤال إلى غيره حذراً. قال عبد الرحمن بن أبي ليلى: أدركت عشرين ومئة من الأنصار من أصحاب رسول الله ﷺ، وكان أحدهم إذا سُئل عن مسألة أحال السائل إلى الآخر حتى يرجع السؤال إلى الأول.<br><b>ثانياً: ضوابط الفتوى (ثلاثة أنواع)</b><br>1) الضوابط العلمية: الإلمام بالعلوم الشرعية وقواعد اللغة العربية (امتلاك العلم الشرعي والقدرة على فهم النصوص ومعانيها)؛ استشارة المختصين في العلوم الطبيعية كالطب والإنسانية كالاقتصاد؛ مراعاة أنواع الفقه الثلاثة: فقه الواقع، فقه التوقع، فقه التنزيل؛ مراعاة الأعراف والعادات عند إصدار الفتوى.<br>2) الضوابط الفكرية: الالتزام بالمنهج الوسط المعتدل دون تشدد أو تساهل. قال الشاطبي: المفتي البالغ ذروة الدرجة هو الذي يحمل الناس على المعهود الوسط فيما يليق بالجمهور، فلا يذهب بهم مذهب الشدة ولا يميل بهم إلى طرف الانحلال. المبدأ الأساسي: الاعتدال لا إفراط ولا تفريط. الإفراط: المبالغة والتشدد؛ التفريط: التقصير والتساهل.<br>3) الضوابط الوطنية: الالتزام بالترخيص الرسمي للفتوى؛ عدم مخالفة قوانين الدولة؛ عدم الإفتاء في القضايا المنظورة أمام القضاء؛ اعتماد المذهب الرسمي للدولة وهو المالكي مع الاستفادة من بقية المذاهب تيسيراً على الناس ومراعاة لأحوالهم.<br><b>ثالثاً: المؤسسات الوطنية للإفتاء في الإمارات</b><br>تنظيم الإفتاء عبر مؤسسات معتمدة لضبط الفتاوى العامة والمستجدة، وتوحيد المنهجية، وتحري الأهلة، وتقديم الخدمات الإفتائية. المراحل: إنشاء المركز الرسمي للإفتاء ضمن الهيئة العامة للشؤون الإسلامية والأوقاف؛ صدور قرار مجلس الوزراء بإنشاء مجلس الإمارات للإفتاء الشرعي؛ تشكيل أعضاء المجلس وبدء ممارسة مهامه؛ تعديل قرار الإنشاء ومنح المجلس استقلالاً مالياً وإدارياً؛ صدور القانون الاتحادي رقم (3) لتنظيم شؤون الإفتاء.<br><b>مجلس الإمارات للإفتاء الشرعي</b><br>• الرؤية: العالمية والاستباقية في الفتاوى الشرعية وترسيخ القيم الإنسانية. الرسالة: إفتاء شرعي معتدل ومؤصل، ومنظومة ذكية، وكفاءات إفتائية وطنية، بهوية حضارية وإنسانية.<br>• قيمه: الإنسانية، الشفافية، التنافسية، الاستدامة، العلمية، المسؤولية، الإيجابية، المواطنة، الاعتدال، الراهنية.<br>• مهامه (عشرة أمور): إصدار الفتاوى العامة والمستجدة والطارئة والاستباقية المتناسبة مع واقع المجتمع الإماراتي؛ إصدار الفتاوى بناءً على طلب الجهات الرسمية أو المؤسسات أو الأشخاص؛ إصدار السياسات والقرارات المنظمة لشؤون الفتوى بالتنسيق مع الجهات المعنية؛ بيان الرأي الشرعي في المسائل المتعلقة بالإساءة إلى المقدسات والتعصب المذهبي؛ إصدار الدراسات والأبحاث المتعلقة بمختلف مجالات الفتاوى؛ تحري الأهلة بما فيها هلال رمضان وشوال وذي الحجة؛ تأهيل الكفاءات الإفتائية وتدريبهم وتنمية مهاراتهم واستقطاب المواهب المتميزة؛ تعزيز الشراكات الاستراتيجية مع مراكز الإفتاء العالمية المعتدلة والجهات الدينية؛ تقديم الخدمات الإفتائية وتطوير منظومة الخدمات الرقمية؛ إبداء الرأي الشرعي حول التشريعات والقوانين ذات الصلة بالإفتاء.<br>• خدماته: الفتاوى الهاتفية، الرسائل النصية، الموقع الإلكتروني، نوافذ إفتائية.<br>• منهجية الإصدار: العبادات: وفق المذهب المالكي (المشهور والرسمي للدولة) مع مراعاة حال المستفتي والأخذ بالتيسير. المعاملات المالية: مراعاة حال المستفتي والأخذ بالتيسير وفقاً للمذاهب الأربعة أو ما أخذت به المجامع الفقهية المعاصرة. المسائل الفكرية: الحوار مع الشباب حول الثقافات الوافدة التي تنشر التطرف والشك في الإيمان والولاء للوطن. الأديان الأخرى: ترسيخ مفاهيم التسامح والتعايش والسلم والابتعاد عن تجريح الآخر. المبدأ الأساسي للمجلس: الفتوى الجماعية والابتعاد عن التعصب والتشدد.<br><b>العقوبات والغرامات (القانون الاتحادي رقم 3 لسنة 2024):</b> الغرامة من 10,000 إلى 200,000 درهم وتُضاعف في حالة العود. المخالفات: إصدار فتوى شرعية عامة في المسائل التي يختص بها المجلس؛ إصدار فتوى شرعية خاصة للجمهور دون ترخيص أو تصريح؛ نشر الفتاوى الشرعية في غير الأحوال المصرح بها؛ نشر فتوى من شأنها إثارة النعرات أو التعصب المذهبي أو الفتنة؛ إصدار فتوى في القضايا المتداولة أمام الجهات القضائية؛ الطعن أو التشكيك في الفتاوى الصادرة عن المجلس؛ عدم التزام مؤسسة إعلامية أو موقع إلكتروني أو مستخدم تواصل اجتماعي بأخذ تصريح من المجلس قبل نشر الفتوى أو تنظيم برامجها.",q:[

{t:"الدرس 6: القوانين والمواثيق والأعراف",e:"<b>أولاً: القوانين المحلية</b><br>• لغةً: القانون مقياس كل شيء؛ أصل الكلمة سرياني بمعنى المسطرة، ويوناني بمعنى العصا المستقيمة، وانتقلت إلى الفارسية بمعنى أصل الشيء وقياسه. اصطلاحاً: مجموعة القواعد التي تحكم سلوك الأفراد في المجتمع ويلتزم بها الأفراد طوعاً أو كرهاً.<br>• القوانين المحلية في الإمارات: مجموعة القواعد العامة الإلزامية التي تصدر عن الدولة لتنظيم سلوك الأشخاص بهدف تحقيق سعادتهم ورفاهية عيشهم. محلية: نابعة من داخل الدولة ومؤسساتها الرسمية وتستهدف الأفراد المنتمين إليها.<br>• أهميتها: تنظيم حياة المجتمع، تحديد الحقوق والواجبات، المحافظة على الأمن والاستقرار، تحقيق المصلحة العامة، تنظيم العلاقات بين الأفراد والمؤسسات. القاعدة الفقهية المهمة: تصرف الإمام على الرعية منوط بالمصلحة.<br>• أقسامها: الدستور (مجموعة القواعد القانونية التي تنظم كيان الدولة وشكلها وتبيّن الحقوق والحريات والواجبات)؛ القوانين الاتحادية (الأداة الرئيسة لتنفيذ أحكام الدستور، تنظم الأمور الاستراتيجية وعلاقة الدولة بمؤسساتها وبالأفراد وعلاقة الأفراد ببعضهم)؛ المراسيم (بقوانين ومراسيم اتحادية يصدرها رئيس الدولة وفقاً للاختصاصات)؛ القرارات (قرارات رئيس الدولة ورئيس مجلس الوزراء ومجلس الوزراء والتعاميم الصادرة من الوزارات والجهات الاتحادية).<br>• مجالات القوانين الإماراتية: الصناعة، التعليم، الصحة، الرياضة، العمل الحكومي.<br>• قانون مكافحة التمييز والكراهية: مرسوم بقانون اتحادي رقم (34) لسنة 2023، أصدره صاحب السمو الشيخ محمد بن زايد آل نهيان حفظه الله. فصوله الأربعة: الأحكام العامة والتعريفات الأساسية؛ الجرائم والعقوبات؛ الأحكام الموضوعية الخاصة؛ الأحكام الختامية. ازدراء الأديان: كل فعل من شأنه الإساءة إلى الذات الإلهية أو الأديان أو الأنبياء أو الرسل أو الكتب السماوية أو دور العبادة وفقاً للقانون. التمييز: كل تفرقة أو تقييد أو استثناء أو تفضيل بين الأفراد أو الجماعات على أساس الدين أو العقيدة أو المذهب أو الملة أو الطائفة أو العرق أو اللون أو الأصل الإثني. خطاب الكراهية: كل قول أو عمل من شأنه إثارة الفتنة أو النعرات أو التمييز بين الأفراد والجماعات. يجرّم إحداث أشكال التمييز وإثارة خطاب الكراهية وتجريم إثارة النعرات والتعصب، ويقر مبدأ التمييز الإيجابي لمصلحة المرأة والطفل وكبار السن.<br><b>ثانياً: المواثيق الدولية</b><br>• القانون الدولي: مجموعة القواعد التي تنظم العلاقات بين الدول ذات السيادة، ويعتمد على ثلاثة مصادر رئيسة حددتها المادة (38) من النظام الأساسي لمحكمة العدل الدولية: 1) المعاهدات والاتفاقيات الدولية (قد تكون ثنائية أو جماعية، ويمكن أن تنص الاتفاقيات الجماعية على حق الدول في الانضمام إليها مستقبلاً). 2) العرف الدولي: قواعد سلوك دولية غير مكتوبة، تكونت من اعتياد الدول على اتباعها بوصفها ملزمة. 3) المبادئ القانونية العامة: المعتقدات والممارسات القانونية المشتركة بين النظم القانونية المتقدمة.<br>• القانون الدولي العام: القواعد التي تنظم العلاقات بين الدول في حالتي السلم والحرب، وبينها وبين المنظمات الدولية. أمثلة: الإعلان العالمي لحقوق الإنسان، اتفاقيات حقوق الطفل والمرأة، اتفاقيات مناهضة التعذيب، اتفاقيات حقوق الأشخاص ذوي الإعاقة.<br>• القانون الدولي الخاص: القواعد التي تنظم التعامل بين الأفراد المحليين والأجانب، ويتناول ثلاثة موضوعات: الجنسية (علاقة تبعية الفرد للدولة)، الموطن (علاقة الفرد بالدولة نتيجة إقامته)، مركز الأجانب (الحقوق والتكاليف والواجبات في الدولة التي يقيم فيها الأجنبي).<br>• أهم الاتفاقيات الدولية التي صادقت عليها الإمارات: اتفاقية حقوق الطفل، اتفاقية حقوق الأشخاص ذوي الإعاقة (وغيرها: الإعلان العالمي لحقوق الإنسان، حقوق المرأة، مناهضة التعذيب).<br><b>ثالثاً: الأعراف والتقاليد (السنع الإماراتي)</b><br>• العُرف لغةً: يدل على التتابع والاتصال، ويدل أيضاً على السكون والطمأنينة، وهو المعروف الذي تسكن إليه النفوس (العالم المذكور: ابن فارس). اصطلاحاً: ما تعارف عليه الناس وصار شائعاً عندهم، سواء في جميع البلدان أو بعضها، قولاً كان أو فعلاً. اهتم علماء أصول الفقه بالأعراف والتقاليد بسبب تغير أعراف الناس واختلاف عاداتهم.<br>• السنع لغةً: يدل على الجمال والخير والرفعة، ويطلق على اللين والأفضل والأجود والأشرف من كل شيء (ابن فارس). اصطلاحاً: مجمل الأقوال والأفعال والأخلاق الواجب الالتزام بها في المواقف الاجتماعية اليومية والمناسبات. السنع أو المذهب أو السمت: مترادفات في التراث الإماراتي، ويراد بها مجموعة القيم والتقاليد وأنماط السلوك التي تعارف عليها أبناء المجتمع في دولة الإمارات.<br>• لماذا ظهر السنع؟ استجابةً للظروف التي مر بها المجتمع الإماراتي، وتأثر بالخصوصية الجغرافية والتجربة التاريخية الممتدة في استثمار الموارد الطبيعية المتاحة.<br>• مقوماته: الالتزام الطوعي (سمة بارزة اكتسبها السنع بمرور الزمن وتوافقها مع رؤية المجتمع وأعرافه)؛ الجذور الراسخة (تقاليد أثبت جدواها في تجارب الآباء والأجداد وتم توظيفها بصورة عملية وإبداعية)؛ القابلية للتطور (قيم حظيت دائماً بدعم مميز وتوجيه حكيم من القيادة الرشيدة).<br>• قيمه: أ) الترابط الأسري وزيارة الأرحام: قيمة أصيلة تظهر في تبادل الزيارات العائلية والمحافظة على صلة الرحم، والارتباط القوي بالأسرة ضروري لتقوية العلاقة بأبناء الشعب والمجتمع. ب) الكرم وحسن الضيافة: من أبرز آداب السنع، ويشمل قواعد وسلوكيات استقبال الضيف وحسن الترحيب به وإكرامه. ومن الأمثال: «البيت اللي ما فيه دلة ما حد يدله»، «فنجان الضحى ولا ناقة ذلول». ج) الفزعة (التطوع ونجدة الملهوف): مظهر من مظاهر الحياة الاجتماعية في الإمارات وتقليد أصيل يقوم على التعاون والتكافل والمساندة في أوقات الشدة والحاجة. خصائصها: تطوع ومبادرة تلقائية؛ تمليها القيم والتقاليد؛ لا يكون دافعها أجراً مادياً أو صلة قرابة أو مصلحة أخرى؛ تجاوزت حدود الوطن إلى مساعدة الشعوب ومواساتها.<br>• ثمرات الأعراف والسنع: تعزيز حب الوطن والانتماء، استدامة الأخلاق الحميدة، تقوية الروابط الأسرية، تعزيز قدرات الفرد.",q:[

let S=JSON.parse(localStorage.getItem('s3')||'{}');S.l=S.l||{};S.w=S.w||{};
const $=document.getElementById('app'),sv=()=>{try{localStorage.setItem('s3',JSON.stringify(S))}catch(e){}},sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const ST=i=>S.l[i]||(S.l[i]={d:0,a:0,c:0,n:0});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
function say(t){try{const sy=speechSynthesis,vs=sy.getVoices(),v=vs.find(x=>/^ar/i.test(x.lang));if(vs.length&&!v){alert('اذا طلعلك هذا، يعني الشرح الصوتي م يستوي عندك. رمسني علطول');return}sy.cancel();const u=new SpeechSynthesisUtterance(t.replace(/ﷺ/g,'صلى الله عليه وسلم').replace(/[«»]/g,''));if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-SA';u.rate=.9;sy.speak(u)}catch(e){}}
function home(){const dn=L.filter((_,i)=>ST(i).d).length,p=Math.round(dn/L.length*100);let h=`<div style="text-align:left"><img src="img/74.png" alt="" style="height:40px;max-width:70%;object-fit:contain" onerror="this.style.display='none'"><h2></h2></div><div class=card><b>تقدمك ${p}%</b> (${dn}/${L.length})<div class=bar><i style="width:${p}%"></i></div></div>`;
L.forEach((l,i)=>{const s=ST(i),m=s.a?Math.round(s.c/s.a*100):0;h+=`<div class=card><b>${s.d?'(مكتمل) ':''}${i+1}. ${l.t}</b><br><small>الإتقان: ${m}%</small><br><button onclick="les(${i})">${s.d?'مراجعة':'ابدأ'}</button></div>`});
h+=`<div class=card><b>الاختبار الشامل</b><br><button class=g onclick="exam()">ابدأ الاختبار</button> <button class=x onclick="weak()">مراجعة نقاط ضعفي</button>${S.ex!=null?`<br><small>آخر نتيجة: ${S.ex}%</small>`:''}</div><button class=x onclick="if(confirm('مسح التقدم؟')){S={l:{},w:{}};sv();home()}">إعادة ضبط</button>`;$.innerHTML=h}
function les(i){window.scrollTo(0,0);$.innerHTML=`<button class=x onclick="home()">← الرئيسية</button><div class=card><h3>${L[i].t}</h3><p>${L[i].e}</p><button class=x onclick="say(L[${i}].e)">استمع للشرح</button><br><button onclick="ask(${i},0)">افهمت، اختبرني</button></div>`}
let cur;
function ask(i,k,ex){const q=L[i].q[k%L[i].q.length],multi=q[1].length>1;cur={i,k,q,ex,sel:new Set(),o:sh([...q[1].map(t=>({t,ok:1})),...q[2].map(t=>({t,ok:0}))]),multi};draw()}
function draw(){const c=cur;$.innerHTML=`<div class=card><small>${c.ex?`سؤال ${c.ex.n+1}/${c.ex.qs.length}`:L[c.i].t}</small><h3>${c.q[0]}</h3>${c.multi?'<small>اختر كل الإجابات الصحيحة</small>':''}<div id=o>${c.o.map((o,j)=>`<button class="o ${c.sel.has(j)?'s':''}" onclick="pick(${j})">${o.t}</button>`).join('')}</div><button onclick="chk()">تأكيد</button><div id=fb></div></div>`}
function pick(j){const c=cur;if(c.done)return;if(c.multi){c.sel.has(j)?c.sel.delete(j):c.sel.add(j)}else{c.sel=new Set([j])}draw()}
function chk(){const c=cur;if(c.done||!c.sel.size)return;const ok=c.o.every((o,j)=>!!o.ok===c.sel.has(j));
if(c.ex){c.ex.r.push({i:c.i,ok});if(!ok)S.w[c.i]=(S.w[c.i]||0)+1;c.ex.n++;sv();return c.ex.n<c.ex.qs.length?ask(...c.ex.qs[c.ex.n],c.ex):res(c.ex)}
c.done=1;const s=ST(c.i);s.a++;if(ok){s.c++;s.d=1}else S.w[c.i]=(S.w[c.i]||0)+1;sv();
document.querySelectorAll('#o button').forEach((b,j)=>{b.classList.remove('s');b.style.borderColor=c.o[j].ok?'var(--g)':(c.sel.has(j)?'var(--r)':'');});
document.getElementById('fb').innerHTML=ok?`<p class=ok>إجابة صحيحة!</p><p>${c.q[3]}</p><button class=g onclick="${c.i+1<L.length?`les(${c.i+1})`:'home()'}">${c.i+1<L.length?'الدرس التالي ←':'الرئيسية'}</button>`:`<p class=no>إجابة غير صحيحة</p><p>الصحيح: ${c.o.filter(o=>o.ok).map(o=>o.t).join('، ')}<br>${c.q[3]}</p><p><small>الدرس لن يكتمل حتى تنجح. سأشرحها بطريقة أبسط وأعطيك سؤالاً جديداً على نفس الفكرة.</small></p><button onclick="alt(${c.i})">إعادة بشرح مختلف</button>`}
function alt(i){const s=ST(i);s.n++;sv();const q=cur.q;$.innerHTML=`<div class=card><h3>شرح مبسّط</h3><p>الفكرة باختصار: ${q[3]}</p><button class=x onclick="les(${i})">أعد قراءة الدرس</button><br><button class=x onclick="say(L[${i}].e)">استمع</button><br><button onclick="ask(${i},${s.n})">سؤال جديد</button></div>`}
function exam(ids){let qs=[];(ids||L.map((_,i)=>i)).forEach(i=>L[i].q.forEach((_,k)=>qs.push([i,k])));qs=sh(qs).slice(0,15);const ex={qs,n:0,r:[]};ask(...qs[0],ex)}
function res(ex){const ok=ex.r.filter(x=>x.ok).length,p=Math.round(ok/ex.r.length*100);S.ex=p;sv();const wl={};ex.r.forEach(x=>{if(!x.ok)wl[x.i]=(wl[x.i]||0)+1});
let h=`<div class=card><h2>نتيجتك: ${ok}/${ex.r.length} (${p}%)</h2><div class=bar><i style="width:${p}%"></i></div>`;const ws=Object.keys(wl);
h+=ws.length?`<h3>مواضيع تحتاج مراجعة:</h3>`+ws.map(i=>`<p class=no>• ${L[i].t} (${wl[i]} خطأ)</p><button class=x onclick="les(${i})">راجع الآن</button>`).join(''):'<p class=ok>ممتاز! لا أخطاء</p>';
const rep=Object.keys(S.w).filter(i=>S.w[i]>1).map(i=>L[i].t);if(rep.length)h+=`<h3>أخطاء متكررة:</h3><p>${rep.join('، ')}</p>`;
h+=`<button onclick="exam()">اختبار جديد بأسئلة مختلفة</button> <button class=x onclick="home()">الرئيسية</button></div>`;$.innerHTML=h}
function weak(){const ws=Object.keys(S.w).filter(i=>S.w[i]).sort((a,b)=>S.w[b]-S.w[a]);if(!ws.length){alert('لا نقاط ضعف مسجلة بعد');return}$.innerHTML=`<button class=x onclick="home()">← الرئيسية</button><div class=card><h3>نقاط ضعفك</h3>${ws.map(i=>`<p>• ${L[i].t} (${S.w[i]} خطأ) <button class=x onclick="les(${i})">راجع</button></p>`).join('')}<button class=g onclick="exam([${ws}])">اختبرني فيها</button></div>`}
